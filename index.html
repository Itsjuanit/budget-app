<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="Administra tus presupuestos y pagos fácilmente." />
    <title>PAGATODO</title>
    <script>
      // Fija el tema antes del primer pintado para que no haya un destello del
      // tema equivocado. Debe quedar en sincronía con src/theme/themeScript.js.
      (function () {
        try {
          var stored = localStorage.getItem("pagatodo:theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "light") {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#f1f5f9");
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
